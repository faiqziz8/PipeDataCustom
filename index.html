<!DOCTYPE html>
<html lang="id">

<style>
:root{--bg:#0f1720;--card:#17212c;--card2:#1e2a37;--line:#2a3a4a;--tx:#e6edf3;--mut:#8b9bab;--acc:#f59e0b;--acc2:#38bdf8;--ok:#22c55e;--bad:#ef4444}
@media (prefers-color-scheme: light){:root{--bg:#f3f5f8;--card:#fff;--card2:#eef2f6;--line:#d8dee6;--tx:#14202b;--mut:#5d6b78;--acc:#d97706;--acc2:#0369a1}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.2px}
header h1 b{color:var(--acc)}
.seg{display:inline-flex;background:var(--card2);border-radius:9px;padding:2px}
.seg button{border:0;background:none;color:var(--mut);padding:5px 10px;border-radius:7px;font-weight:600;font-size:13px}
.seg button.on{background:var(--acc);color:#111}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 84px);max-width:900px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 2px 7px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.card h3{font-size:13px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>label,.row>.f{flex:1 1 130px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}
select,input{width:100%;margin-top:3px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:16px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.ig{display:flex;gap:6px}.ig input{flex:1}.ig select{width:auto;flex:0 0 auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:11.5px;position:sticky;top:0;background:var(--card)}
tr.sel td{background:rgba(245,158,11,.14)}
tbody tr{cursor:pointer}
.tw{overflow-x:auto;margin:0 -4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;font-variant-numeric:tabular-nums}
.kv div{padding:7px 2px;border-bottom:1px solid var(--line)}
.kv div:nth-child(even){text-align:right;font-weight:600}
.kv .hl{color:var(--acc)}
.res{background:var(--card2);border-radius:10px;padding:10px;margin-top:6px}
.big{font-size:22px;font-weight:700;color:var(--acc)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}
.pill.ok{background:rgba(34,197,94,.18);color:var(--ok)}.pill.bad{background:rgba(239,68,68,.18);color:var(--bad)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#111}
.hide{display:none!important}
.sub{color:var(--mut);font-size:12px;font-weight:400}
details{border-top:1px solid var(--line);padding-top:6px;margin-top:8px}
summary{cursor:pointer;color:var(--acc2);font-size:13px}
.fx{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut)}
:root{--steel:#3d4c5b;--hatch:#7e93a8}
@media (prefers-color-scheme: light){:root{--steel:#cfd8e1;--hatch:#8797a7}}
.dw{width:100%;height:auto;display:block;max-width:560px;margin:2px auto 6px}
.dw text{font:600 11px -apple-system,"Segoe UI",sans-serif;fill:var(--tx);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.dw text.d{fill:var(--acc2)}.dw text.s{font-size:10px;fill:var(--mut)}
.st{fill:var(--steel);stroke:var(--tx);stroke-width:1.1;stroke-linejoin:round}
.hz{fill:url(#hatch);stroke:none}.hx{stroke:var(--hatch);stroke-width:1}
.lp{fill:var(--card2);stroke:var(--mut);stroke-width:1}
.bgp{fill:var(--card);stroke:var(--tx);stroke-width:1}
.ol{fill:none;stroke:var(--tx);stroke-width:1.1}
.dm{stroke:var(--acc2);stroke-width:1;fill:none}
.ex{stroke:var(--mut);stroke-width:.6}
.cl{stroke:var(--mut);stroke-width:.7;stroke-dasharray:12 3 2 3;fill:none}
.dsh{stroke:var(--mut);stroke-width:.9;stroke-dasharray:4 3;fill:none}
.wb{fill:var(--acc);stroke:var(--tx);stroke-width:.6}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.tile{background:var(--card2);border-radius:10px;padding:9px 10px}
.tile small{display:block;color:var(--mut);font-size:11.5px}
.tile b{font-size:19px;color:var(--acc)}.tile i{font-style:normal;font-size:12px;color:var(--mut);display:block}
.chips.sm button{padding:5px 10px;font-size:12.5px}
.chips button:disabled{opacity:.35}
.twoc{display:grid;grid-template-columns:1fr;gap:4px}
@media(min-width:700px){.twoc{grid-template-columns:1fr 1fr}}
nav button{font-size:10px;padding-left:0;padding-right:0}
:root{--c-tm:#38bdf8;--c-ca:#a78bfa;--c-mill:#f59e0b;--c-spare:#22c55e;--wrn:#eab308}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.cgrid button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 11px;font:inherit}
.cgrid button b{display:block;font-size:14px}.cgrid button span{font-size:11.5px;color:var(--mut)}
.cgrid button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.cgrid button.on b{color:var(--acc)}
.pill.inf{background:rgba(56,189,248,.16);color:var(--acc2)}.pill.wrn{background:rgba(234,179,8,.18);color:var(--wrn)}
.cbar{display:flex;height:16px;border-radius:6px;overflow:hidden;margin:4px 0 6px}.cbar i{display:block}
.ckeys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}.ckeys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.msgs{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--mut)}.msgs li{margin-bottom:5px}.msgs li.w{color:var(--bad)}
.lpbtn{border:1px solid var(--line);background:var(--card2);color:var(--acc2);border-radius:9px;padding:8px 12px;font:600 13px inherit;margin-bottom:6px}
.eqb{font-size:13.5px;line-height:1.6;overflow-x:auto}
table.lt td{white-space:normal}

.dw{background:#fff;border-radius:10px;--tx:#151515;--card:#fff;--card2:#eef1f4;--steel:#fff;--hatch:#9aa3ad;--acc2:#151515;--mut:#6b7280;--acc:#c2410c}
.dw text{font-weight:500}
.sheet{background:#fff;color:#151515;border-radius:14px;padding:14px 12px 10px;margin-bottom:10px}
.sheet .dw{margin:4px auto 0}
.sh-t{text-align:center;font-weight:700;font-size:17px;margin-bottom:8px}
.sh-h{font-size:16px;font-weight:600}
.sh-l{font-size:13.5px;line-height:1.35}
.sh-f{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;border-top:1px solid #ddd;padding-top:7px;margin-top:2px}
.sg{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--line);gap:1px}
.sgh{background:var(--card2);text-align:center;padding:8px 4px;font-size:13px;color:var(--mut);font-weight:600}
.sgc{background:var(--card)}
.sgc select{border:0;border-radius:0;margin:0;text-align:center;text-align-last:center;font-weight:600;background:var(--card);padding:12px 6px;font-size:16px}
.sgc select:disabled{opacity:.35}
details.more{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px 10px;margin-bottom:12px}
details.more>summary{font-weight:700;font-size:14px;padding:8px 0;color:var(--acc2);list-style:none;cursor:pointer}
details.more>summary::before{content:"▸ ";}details.more[open]>summary::before{content:"▾ ";}
details.more h3{font-size:13px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
</style>
</head>

    900: [2220, 2035, 1965, 1900, 1810], 1500: [3705, 3395, 3270, 3170, 3015], 2500: [6170, 5655, 5450, 5280, 5025] } };
function interp(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  for (let i = 1; i < xs.length; i++) if (x <= xs[i]) return ys[i - 1] + (ys[i] - ys[i - 1]) * (x - xs[i - 1]) / (xs[i] - xs[i - 1]);
  return null;
}
function flangeRating(cls, F) { const r = B165.cls[cls]; return r ? interp(B165.temps, r, F) : null; }

/* B31.3 basic allowable stress, psi (null = out of tabulated range) */
function allowS(g, F) {
  if (!g[3]) return null;
  if (F > 400) return null;
  return interp([100, 200, 300, 400], g[3], F) * 1000;
}

/* Mill tolerance (minus side), returns {tol (inch), txt} for nominal t */
function millTol(mode, t, manualPct) {
  const MM = 1 / 25.4;
  if (mode === 'manual') return { tol: t * manualPct / 100, txt: `−${fmt(manualPct, 1)}%`, pct: manualPct };
  if (mode === 'api5l_w') {
    if (t <= 5 * MM) return { tol: .5 * MM, txt: '−0,5 mm (t ≤ 5,0 mm)', pct: null };
    if (t < 15 * MM) return { tol: .1 * t, txt: '−10% (5,0 < t < 15,0 mm)', pct: 10 };
    return { tol: 1.5 * MM, txt: '−1,5 mm (t ≥ 15,0 mm)', pct: null };
  }
  if (mode === 'api5l_s') {
    if (t <= 4 * MM) return { tol: .5 * MM, txt: '−0,5 mm (t ≤ 4,0 mm)', pct: null };
    if (t < 25 * MM) return { tol: .125 * t, txt: '−12,5% (4,0 < t < 25,0 mm)', pct: 12.5 };
    const a = Math.max(3 * MM, .1 * t);
    return { tol: a, txt: '−3,0 mm atau −10% (t ≥ 25,0 mm)', pct: null };
  }
  return { tol: .125 * t, txt: '−12,5%', pct: 12.5 };
}
function fmt(v, d) { return Number(v).toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }); }

/* Smallest nominal t with t - tol(t) >= need (t - tol is monotonic for every mode) */
function solveTn(need, mode, pct) {
  let lo = need, hi = need * 2 + .1;
  for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (m - millTol(mode, m, pct).tol >= need) hi = m; else lo = m; }
  return hi;
}

function wtList(npsKey, mat, mode) {
  const row = B3610[npsKey]; if (!row) return [];
  const map = new Map();
  const add = (t, lab) => { const k = t.toFixed(3); const e = map.get(k); if (e) { if (lab && !e.labels.includes(lab)) e.labels.push(lab); } else map.set(k, { t, labels: lab ? [lab] : [] }); };
  if (mat.kind === 'ss' && B3619[npsKey]) ['5S', '10S', '40S', '80S'].forEach((l, i) => { const t = B3619[npsKey][i]; if (t) add(t, l); });
  row[2].forEach(([l, t]) => add(t, 'Sch ' + l.replace(/^(STD|XS|XXS)/, '$1').replace(/^Sch /, '')));
  if (false) {
    const ts = row[2].map(x => x[1]); const lo = Math.min(...ts), hi = parseFloat(npsKey) >= 14 ? Math.max(...ts, 1.25) : Math.max(...ts);
    EXTRA.forEach(t => { if (t >= lo - 1e-9 && t <= hi + 1e-9) add(t, ''); });
  }
  return [...map.values()].sort((a, b) => a.t - b.t).map(e => ({ t: e.t, label: e.labels.length ? e.labels.join(' · ').replace(/Sch (STD|XS|XXS)/g, '$1') : 'Non-schedule' }));
}
function schMinT(npsKey, mat, code) {
  if (!code) return 0;
  const row = B3610[npsKey]; if (!row) return 0;
  if (mat.kind === 'ss' && B3619[npsKey]) { const idx = { '10': 1, '40': 2, '80': 3 }[code]; if (idx != null && B3619[npsKey][idx]) return B3619[npsKey][idx]; }
  const find = re => { const r = row[2].find(([l]) => re.test(l)); return r ? r[1] : null; };
  if (code === '10') return find(/^10\b/) || row[2][0][1];
  if (code === '40') return find(/STD|40/) || 0;
  if (code === '80') return find(/XS|80/) || 0;
  return 0;
}

/* Main calculation. st = normalized inputs */
function calc(st) {
  const mat = MATS[st.spec], g = mat.grades[st.grade] || mat.grades[mat.def], ty = mat.types[st.type] || mat.types[0];
  const row = B3610[st.nps];
  const D = st.odMode === 'custom' && st.odCustom > 0 ? st.odCustom : row[0];
  const P = st.P, Tf = st.Tf, warn = [], info = [];
  const b318 = st.code === 'b318';
  const S = g[1];
  let tm, f = {};
  const tolMode = st.tolMode === 'manual' ? 'manual' : mat.tol === 'api5l' ? (ty[0] === 'SMLS' ? 'api5l_s' : 'api5l_w') : 'p125';
  if (b318) {
    const loc = LOC.find(l => l[0] === st.loc) || LOC[4];
    const F = st.fOver ? st.fVal : loc[2];
    const E = st.eOver ? st.eVal : ty[2];
    const tf = tFactor(Tf), T = st.tOver ? st.tVal : tf.T;
    if (!tf.ok && !st.tOver) warn.push('Temperatur desain di atas 450 °F (232 °C). Tabel 841.1.8-1 ASME B31.8 tidak mencakupnya; isi T secara manual berdasarkan kajian material.');
    tm = P * D / (2 * S * F * E * T);
    f = { F, E, T, loc, tInterp: tf.interp };
    if (st.loc !== '4' && !st.fOver) info.push('Periksa kembali kelas lokasi: area padat penduduk umumnya Kelas Lokasi 4 (F = 0,4).');
    if (st.fOver) info.push(`Design factor diisi manual F = ${fmt(F, 2)} (mis. pengecualian Tabel 841.1.6-2 untuk stasiun/fabricated assemblies).`);
    if (mat.kind === 'ss' && ty[0] !== 'SMLS' && !st.eOver) info.push('ASTM A312 welded tidak tercantum di Tabel 841.1.7-1 ASME B31.8; E diambil 0,80 (setara pipa EFW A134/A139). Verifikasi dengan code.');
  } else {
    const Sa = st.sOver ? st.sVal : allowS(g, Tf);
    if (Sa == null) warn.push('Allowable stress S untuk grade/temperatur ini di luar tabel bawaan aplikasi. Isi S manual dari ASME B31.3 Tabel A-1.');
    const SS = Sa || 1;
    const E = st.eOver ? st.eVal : ty[3];
    const W = st.wOver ? st.wVal : 1;
    const Y = st.yOver ? st.yVal : .4;
    tm = P * D / (2 * (SS * E * W + P * Y));
    f = { Sa: SS, E, W, Y, Sok: Sa != null, PSE: P / (SS * E) };
    const Samb = allowS(g, 100);
    f.ratio = Samb && Sa ? Math.min(Samb / Sa, 6.5) : 1;
    if (Tf > 800 && !st.wOver) warn.push('Temperatur > 800 °F: W dan Y dapat < 1 / ≠ 0,4 (Tabel 302.3.5-1 dan 304.1.1-1). Isi manual.');
    if (!st.sOver && Sa != null && Tf > 100) info.push(`S = ${fmt(Sa / 1000, 1)} ksi diinterpolasi dari nilai bawaan pada ${fmt(Tf, 0)} °F. Verifikasi terhadap ASME B31.3 Tabel A-1 edisi berlaku.`);
  }
  const c = st.ca + st.mech;
  const need = tm + c;
  const tn = solveTn(need, tolMode, st.tolPct);
  const tnTol = millTol(tolMode, tn, st.tolPct);
  const list = wtList(st.nps, mat, st.wtMode);
  const tMinSch = schMinT(st.nps, mat, st.minSch);
  const rows = list.map(w => {
    const mt = millTol(tolMode, w.t, st.tolPct);
    const tmin = w.t - mt.tol, tcor = tmin - c;
    return { ...w, tol: mt.tol, tolTxt: mt.txt, tmin, tcor, ok: tmin >= need - 1e-9, schOk: w.t >= tMinSch - 1e-9 };
  });
  let sel = null;
  if (st.wtSel === 'custom' && st.wtCustom > 0) {
    const mt = millTol(tolMode, st.wtCustom, st.tolPct);
    sel = { t: st.wtCustom, label: 'Manual', tol: mt.tol, tolTxt: mt.txt, tmin: st.wtCustom - mt.tol, tcor: st.wtCustom - mt.tol - c, ok: st.wtCustom - mt.tol >= need - 1e-9, schOk: st.wtCustom >= tMinSch - 1e-9, manual: true };
  } else if (st.wtSel && st.wtSel !== 'auto') {
    sel = rows.find(r => r.t.toFixed(3) === st.wtSel) || null;
    if (sel) sel = { ...sel, manual: true };
  }
  if (!sel) sel = rows.find(r => r.ok && r.schOk) || null;
  const auto = rows.find(r => r.ok && r.schOk) || null;
  rows.forEach(r => { r.sel = sel && Math.abs(r.t - sel.t) < 1e-6; r.auto = auto && Math.abs(r.t - auto.t) < 1e-6; });

  // capacity & stresses for each row
  const cap = t => {
    const mt = millTol(tolMode, t, st.tolPct), tmin = t - mt.tol, tc = tmin - c;
    if (b318) {
      const fac = f.F * f.E * f.T;
      return { maop: 2 * S * t / D * fac, mawp: tc > 0 ? 2 * S * tc / D * fac : 0, sh: P * D / (2 * t), shc: tc > 0 ? P * D / (2 * tc) : Infinity, allow: S * fac };
    }
    const sew = f.Sa * f.E * f.W;
    const pOf = x => x > 0 ? 2 * sew * x / (D - 2 * f.Y * x) : 0;
    return { maop: pOf(t), mawp: pOf(tc), sh: P * D / (2 * t), shc: tc > 0 ? P * D / (2 * tc) : Infinity, allow: sew };
  };
  rows.forEach(r => { const k = cap(r.t); r.mawp = k.mawp; r.maop = k.maop; r.pct = k.sh / S * 100; r.kgm = .0246615 * (D * 25.4 - r.t * 25.4) * r.t * 25.4; });

  const out = { st, mat, g, ty, D, P, Tf, S, tm, c, need, tn, tnTol, tolMode, f, rows, sel, auto, warn, info, b318, tMinSch, checks: [] };
  if (!sel) { warn.push('Tidak ada wall thickness standar pada daftar yang memenuhi tn untuk NPS ini. Naikkan grade material, ubah daftar WT, atau isi WT manual.'); return out; }

  const k = cap(sel.t);
  Object.assign(sel, { mawp: k.mawp, maop: k.maop, sh: k.sh, shc: k.shc, allow: k.allow, pct: k.sh / S * 100, pctc: k.shc / S * 100, kgm: .0246615 * (D - sel.t) * 25.4 * sel.t * 25.4 });
  sel.ID = D - 2 * sel.t;
  sel.Dt = D / sel.t;
  out.wTot = st.L > 0 ? sel.kgm * st.L : null;
  // test pressure
  const kTest = b318 ? st.testK : st.testK * f.ratio;
  out.Ptest = P * kTest; out.kTest = kTest;
  out.shTest = out.Ptest * D / (2 * sel.t); out.pctTest = out.shTest / S * 100;
  out.shTestMin = sel.tmin > 0 ? out.Ptest * D / (2 * sel.tmin) : Infinity; out.pctTestMin = out.shTestMin / S * 100;
  // alternative thick wall
  if (b318 && sel.Dt < 30) {
    out.tmAlt = P * D / (2 * S * f.F * f.E * f.T + P);
    info.push(`D/t = ${fmt(sel.Dt, 1)} < 30 (pipa berdinding tebal). ASME B31.8 841.1.1(b) mengizinkan rumus alternatif P = 2St/(D − t)·FET, yang memberi tm = ${fmt(out.tmAlt, 4)} in. Aplikasi tetap memakai Persamaan (1) yang lebih konservatif.`);
  }
  if (b318 && g[1] >= 70300) info.push('Grade X70 ke atas tidak cocok untuk servis asam (sour); kekerasan las lapangan bisa melampaui batas NACE/AMPP. Butuh WPS khusus.');
  if (mat.kind === 'ss' && st.ca > 0) info.push('Material tahan korosi (stainless) tidak memerlukan corrosion allowance. Pertimbangkan CA = 0.');
  if (mat.kind === 'cs' && st.ca === 0) info.push('Corrosion allowance 0 untuk baja karbon. Nilai umum pada perencanaan awal adalah 0,0625 in.');
  if (st.flCls && B165.cls[st.flCls]) {
    const Tr = st.flBasis === 'amb' ? 100 : Tf;
    const r = flangeRating(st.flCls, Tr);
    out.flRating = r; out.flT = Tr;
    if (r != null && P > r + 1e-6) warn.push(`Tekanan desain ${fmt(P, 0)} psig melebihi rating flange ASME B16.5 Class ${st.flCls} Grup 1.1 pada ${Tr <= 100 ? '−20 s.d. 100' : fmt(Tr, 0)} °F (${fmt(r, 0)} psig).`);
    if (r != null && P < r * .999) info.push(`Rating flange Class ${st.flCls} pada ${Tr <= 100 ? '−20 s.d. 100' : fmt(Tr, 0)} °F = ${fmt(r, 0)} psig. Catatan: jangan menaikkan tekanan desain hanya agar sama dengan rating flange bila melebihi MAOP yang dibutuhkan.`);
    if (r == null) warn.push('Temperatur di luar tabel rating flange bawaan (≤ 500 °F).');
  }
  if (sel.manual && !sel.ok) warn.push('WT yang dipilih manual lebih tipis dari Thickness Necessary.');
  if (sel.manual && auto && sel.t > auto.t + 1e-6) info.push(`WT terpilih lebih tebal dari WT minimum yang memenuhi (${fmt(auto.t, 3)} in, ${auto.label}). Pastikan alasannya (beban eksternal, HDD, ketersediaan, PMC).`);

  // checks
  const C = out.checks;
  C.push({ k: 'WT terpilih ≥ Thickness Necessary', v: `${fmt(sel.t, 3)} in`, lim: `≥ ${fmt(tn, 4)} in`, ok: sel.ok, uc: tn / sel.t });
  C.push({ k: 'Tebal minimum sisa (t − mill tol − c) ≥ tm', v: `${fmt(sel.tcor, 4)} in`, lim: `≥ ${fmt(tm, 4)} in`, ok: sel.tcor >= tm - 1e-9, uc: tm / Math.max(sel.tcor, 1e-9) });
  C.push({ k: b318 ? 'Hoop stress (t sisa) ≤ F·E·T·SMYS' : 'Tekanan desain ≤ MAWP (t sisa)', v: b318 ? `${fmt(sel.shc, 0)} psi` : `${fmt(P, 0)} psig`, lim: b318 ? `≤ ${fmt(sel.allow, 0)} psi` : `≤ ${fmt(sel.mawp, 0)} psig`, ok: b318 ? sel.shc <= sel.allow + 1e-6 : P <= sel.mawp + 1e-6, uc: b318 ? sel.shc / sel.allow : P / sel.mawp });
  if (st.minSch) C.push({ k: 'WT ≥ schedule minimum (Piping Material Class)', v: `${fmt(sel.t, 3)} in`, lim: `≥ ${fmt(out.tMinSch, 3)} in`, ok: sel.schOk, uc: out.tMinSch / sel.t });
  if (b318) C.push({ k: 'Dinding tipis, D/t > 30 (syarat Persamaan 1)', v: fmt(sel.Dt, 1), lim: '> 30', ok: sel.Dt > 30, info: true, uc: 30 / sel.Dt });
  else {
    C.push({ k: 'tm < D/6 (syarat Persamaan 3)', v: `${fmt(tm, 4)} in`, lim: `< ${fmt(D / 6, 3)} in`, ok: tm < D / 6, uc: tm / (D / 6) });
    C.push({ k: 'P/(S·E) ≤ 0,385', v: fmt(f.PSE, 3), lim: '≤ 0,385', ok: f.PSE <= .385, uc: f.PSE / .385 });
  }
  if (st.dtLim > 0) C.push({ k: 'D/t ≤ batas handling / konstruksi', v: fmt(sel.Dt, 1), lim: `≤ ${fmt(st.dtLim, 0)}`, ok: sel.Dt <= st.dtLim, uc: sel.Dt / st.dtLim });
  C.push({ k: `Hoop stress uji tekan (${fmt(out.kTest, 2)}× P) ≤ 100% SMYS`, v: `${fmt(out.pctTest, 1)}% SMYS`, lim: '≤ 100%', ok: out.pctTest <= 100, warnIf: out.pctTest > 90, uc: out.pctTest / 100 });
  if (out.flRating != null) C.push({ k: `P desain ≤ rating flange Class ${st.flCls}`, v: `${fmt(P, 0)} psig`, lim: `≤ ${fmt(out.flRating, 0)} psig`, ok: P <= out.flRating + 1e-6, uc: P / out.flRating });
  out.fail = C.filter(x => !x.ok && !x.info).length;
  return out;
}

/* Summary across all NPS with the same inputs */
function calcAll(st) {
  return NPS.map(n => {
    const r = calc({ ...st, nps: n, odMode: 'nps', wtSel: 'auto' });
    return { nps: n, dn: B3610[n][1], D: r.D, tm: r.tm, tn: r.tn, sel: r.sel, fail: r.fail };
  });
}

return { BAR, MPA, B3610, B3619, NPS, MATS, LOC, TDF, B165, tFactor, flangeRating, allowS, millTol, calc, calcAll, wtList, fmt };
})();

["36",900,36,"10:.312,STD:.375,20:.500,XS:.500,30:.625,40:.750"],
["42",1050,42,"STD:.375,20:.500,XS:.500,30:.625,40:.750"],
["48",1200,48,"STD:.375,XS:.500"]];
const SCH_ORDER=["5S","10S","10","20","30","STD","40S","40","60","XS","80S","80","100","120","140","160","XXS"];
const PIPES=PIPE_RAW.map(([nps,dn,od,s])=>{const w={};s.split(",").forEach(p=>{const[k,v]=p.split(":");w[k]=+v});
  const npsN=frac(nps);if(npsN<=24){if(w.STD)w["40S"]=w.STD;if(w.XS)w["80S"]=w.XS}

// grouped schedules (same WT merged)
function schedList(p){const m=new Map();SCH_ORDER.forEach(k=>{if(p.w[k]!=null){const t=p.w[k];if(!m.has(t))m.set(t,[]);m.get(t).push(k)}});

  const rMill=Ro-s.tol*k*sc,rTm=rMill-R.tm*k*sc,rIn=Ro-tDraw,rCa=rIn+R.c*k*sc;
  let o=svgOpen(W,H)+rg(Ro,rMill,"var(--c-mill)")+rg(rMill,Math.max(rTm,rCa),"var(--c-tm)");

  o+=tx(cx,cy+14,s.label,"s");

   const A=g*t+(t-rf)*(t-rf)*Math.tan(a)+2/3*Wc*hc+2/3*(g+2)*1.0;
   const kgJ=A*1e-6*Math.PI*(D-t)/1000*7850,el=kgJ/ef;
   // drawing
   const W=340,s=Math.min(110/t,(W/2-50)/(bw+g/2+8)),cx=W/2,yt=64,yb=yt+t*s,H=yb+70;let o=svgOpen(W,H);
   const gp=g/2*s,bws=bw*s,rfs=rf*s;
   o+=sect([[10,yt],[cx-gp-bws,yt],[cx-gp,yb-rfs],[cx-gp,yb],[10,yb]])+sect([[W-10,yt],[cx+gp+bws,yt],[cx+gp,yb-rfs],[cx+gp,yb],[W-10,yb]]);
   const wc=Wc/2*s;o+=`<path d="M${f1(cx-wc)},${yt}Q${cx},${f1(yt-hc*s*2)} ${f1(cx+wc)},${yt}" class="dsh" style="stroke:var(--acc)"/><path d="M${f1(cx-gp-3)},${f1(yb)}Q${cx},${f1(yb+6)} ${f1(cx+gp+3)},${f1(yb)}" class="dsh" style="stroke:var(--acc)"/>`;
   o+=dim(10,yt,10,yb,"t "+n(t,2),-14);
   o+=dim(cx-gp,yb,cx+gp,yb,"gap "+n(g,1),22);
   if(rf>0)o+=dim(cx-gp,yb-rfs,cx-gp,yb,"rf "+n(rf,1),-(gp+bws+30));
   o+=ln(cx-gp-bws,yt,cx-gp-bws,yt-22,"ex")+tx(cx-gp-bws/2-14,yt-14,n(a*180/Math.PI,1)+"°","d")+ln(cx-gp,yb-rfs,cx-gp,yt-18,"ex");
   o+=dim(cx-wc,yt,cx+wc,yt,"cap "+n(Wc,1),-(hc*s*2+14));
   $("#lR").innerHTML=o+`</svg><div class="kv"><div>WT</div><div>${n(t,2)} mm</div><div>Lebar groove atas</div><div>${n(g+2*bw,1)} mm</div><div>Lebar cap</div><div>${n(Wc,1)} mm</div>
   <div>Luas penampang las</div><div>${n(A,1)} mm²</div><div>Logam las per joint</div><div class="hl">${n(kgJ,3)} kg</div><div>Elektroda/kawat per joint</div><div>${n(el,3)} kg</div>
   <div>Total logam las ${J} joint</div><div>${n(kgJ*J,1)} kg</div><div>Total elektroda/kawat</div><div class="big">${n(el*J,1)} kg</div>
   ${nps!=="c"?`<div>Diameter-inch (DI)</div><div>${n(pipeBy(nps).npsN*J,1)} DI</div>`:""}</div>`};
  $("#lN").addEventListener("change",()=>{fillW();c()});bindPipe("l",c);fillW();c();["lW","lA","lRf","lG","lC","lE","lJ"].forEach(i=>$("#"+i).addEventListener("input",c));
},
offset(){ $("#cBody").innerHTML=`<div class="card"><h2>Offset & Rolling Offset</h2>
  <div class="row"><label>Offset vertikal / set (mm)<input id="oS" type="number" inputmode="decimal" value="500"></label><label>Offset horizontal / roll (mm)<input id="oR" type="number" inputmode="decimal" value="0"></label></div>
  <label>Sudut fitting (°)<select id="oA"><option>45</option><option>30</option><option>60</option><option>22.5</option><option>11.25</option></select></label>
  <div class="res" id="oRes"></div></div>`;
  const c=()=>{const s=+$("#oS").value,r=+$("#oR").value,a=+$("#oA").value*Math.PI/180;const tr=Math.hypot(s,r);
   const travel=tr/Math.sin(a),run=tr/Math.tan(a);
   $("#oRes").innerHTML=`<div class="kv"><div>Offset sebenarnya (true offset)</div><div>${n(tr,1)} mm</div><div>Travel (center-center)</div><div class="big">${n(travel,1)} mm</div>
   <div>Run (panjang maju)</div><div>${n(run,1)} mm</div>${r?`<div>Sudut roll</div><div>${n(Math.atan2(r,s)*180/Math.PI,1)}°</div>`:""}</div>
   <div class="fx">Travel = offset / sin θ ; Run = offset / tan θ. Kurangi center-to-end fitting untuk panjang potong.</div>`};
  ["oS","oR","oA"].forEach(i=>$("#"+i).addEventListener("input",c));c();
}};

/* ================= KONVERSI ================= */
const CONV={
"Gas: Energi ↔ Volume":"gas",
"Panjang":{m:1,mm:.001,cm:.01,km:1000,in:.0254,ft:.3048,yd:.9144,mile:1609.344},
"Tekanan":{bar:1e5,psi:6894.757,MPa:1e6,kPa:1e3,Pa:1,"kg/cm²":98066.5,atm:101325,"mmH₂O":9.80665,"inH₂O":249.089,mmHg:133.322},
"Gaya":{N:1,kN:1000,kgf:9.80665,tf:9806.65,lbf:4.44822,kip:4448.22},
"Massa":{kg:1,ton:1000,g:.001,lb:.453592,"short ton":907.185},
"Volume":{"m³":1,L:.001,"US gal":.00378541,bbl:.158987,"ft³":.0283168,"in³":1.6387e-5},
"Laju alir gas":{"Nm³/h":1,"Sm³/h":0.9476,"MMSCFD":1177.17,"SCFH":0.026853,"Sm³/d":0.039483},
"Laju alir cairan":{"m³/h":1,"L/s":3.6,"L/min":.06,"US gpm":.227125,"bbl/d":.0066245},
"Luas":{"m²":1,"mm²":1e-6,"cm²":1e-4,"in²":.00064516,"ft²":.092903,ha:1e4},
"Torsi":{"N·m":1,"kgf·m":9.80665,"lbf·ft":1.35582,"lbf·in":.112985},
"Energi":{kJ:1,MJ:1000,kWh:3600,BTU:1.05506,MMBTU:1055060,kcal:4.1868},
"Suhu":null};
let cvCat=ls("cv")||"Tekanan";
// gas energy <-> volume. Base: SCF/d (60°F, 14.696 psia) and MMBTU/d
const GVOL={"MMSCFD":1e6,"MSCFD":1e3,"SCFD":1,"MMSCF/jam":24e6,"Sm³/d (15 °C)":35.3830,"MMSm³/d (15 °C)":35.3830e6,"Sm³/jam (15 °C)":35.3830*24,"Nm³/d (0 °C)":37.3258,"Nm³/jam (0 °C)":37.3258*24};
const GEN={"MMBTUD":1,"BBTUD":1000,"MMBTU/jam":24,"GJ/d":1/1.055056,"TJ/d":1000/1.055056,"MW (termal)":86.4/1.055056,"MMkcal/d":3.96832};
const GHVU={"BTU/SCF":1,"MJ/Sm³":947.817/35.3830,"kcal/Nm³":3.96832/37.3258,"MJ/Nm³":947.817/37.3258};
function viewGasConv(){
  const gu=ls("ghvU")||"BTU/SCF",gv=ls("ghvV")||"1000",u0=ls("gcU")||"BBTUD",v0=ls("gcV")||"1";
  const units=[...Object.keys(GEN).map(k=>[k,"E"]),...Object.keys(GVOL).map(k=>[k,"V"])];
  $("#app").innerHTML=`<div class="chips" id="cvC">${Object.keys(CONV).map(k=>`<button class="${k===cvCat?"on":""}" data-k="${k}">${k}</button>`).join("")}</div>
  <div class="card"><h2>Gas: Energi ↔ Volume <span class="sub">MMBTUD / BBTUD ↔ MMSCFD</span></h2>
   <div class="row"><label>Nilai<input id="gcV" type="number" inputmode="decimal" value="${v0}"></label>
   <label>Dari<select id="gcU">${units.map(([k])=>opt(k,k,u0)).join("")}</select></label></div>
   <div class="row"><label>Nilai kalor gas (GHV)<div class="ig"><input id="ghvV" type="number" inputmode="decimal" value="${gv}"><select id="ghvU">${Object.keys(GHVU).map(k=>opt(k,k,gu)).join("")}</select></div></label></div>
   <div class="chips sm" id="ghvP"><button data-v="1000">1.000 (rule of thumb)</button><button data-v="1020">1.020</button><button data-v="1050">1.050</button><button data-v="1100">1.100</button></div>
   <div class="res" id="gcR"></div>
   <div class="note">MMSCFD = MMBTUD ÷ GHV (BTU/SCF). BBTUD = 1.000 MMBTUD. Volume standar 60 °F &amp; 14,696 psia (SCF); Sm³ 15 °C; Nm³ 0 °C, 1 atm. Pakai GHV (gross/HHV) dari hasil analisis gas / kontrak jual-beli gas — angka 1.000 BTU/SCF hanya pendekatan.</div></div>`;
  $("#cvC").onclick=e=>{const b=e.target.closest("button");if(!b)return;cvCat=b.dataset.k;ls("cv",cvCat);viewKonversi()};
  const c=()=>{const v=+$("#gcV").value,u=$("#gcU").value,ghv=+$("#ghvV").value*GHVU[$("#ghvU").value];ls("gcU",u);ls("gcV",$("#gcV").value);ls("ghvV",$("#ghvV").value);ls("ghvU",$("#ghvU").value);
   let mmbtud,scfd;if(GEN[u]){mmbtud=v*GEN[u];scfd=ghv>0?mmbtud*1e6/ghv:NaN}else{scfd=v*GVOL[u];mmbtud=scfd*ghv/1e6}
   const main=GEN[u]?["MMSCFD",scfd/1e6]:["BBTUD",mmbtud/1000];
   $("#gcR").innerHTML=`<div class="kv"><div>${main[0]}</div><div class="big">${fmtG(main[1])}</div></div>
    <h3 style="margin:12px 0 4px;font-size:12px;color:var(--mut)">ENERGI</h3><div class="kv">${Object.entries(GEN).map(([k,f])=>`<div>${k}</div><div class="${k===u?"hl":""}">${fmtG(mmbtud/f)}</div>`).join("")}</div>
    <h3 style="margin:12px 0 4px;font-size:12px;color:var(--mut)">VOLUME</h3><div class="kv">${Object.entries(GVOL).map(([k,f])=>`<div>${k}</div><div class="${k===u?"hl":""}">${fmtG(scfd/f)}</div>`).join("")}</div>
    <div class="note">GHV dipakai: ${fmtG(ghv)} BTU/SCF = ${fmtG(ghv/GHVU["MJ/Sm³"])} MJ/Sm³ = ${fmtG(ghv/GHVU["kcal/Nm³"])} kcal/Nm³</div>`};
  ["gcV","ghvV"].forEach(i=>$("#"+i).oninput=c);["gcU","ghvU"].forEach(i=>$("#"+i).onchange=c);
  $("#ghvP").onclick=e=>{const b=e.target.closest("button");if(!b)return;$("#ghvU").value="BTU/SCF";$("#ghvV").value=b.dataset.v;c()};
  c();
}
function viewKonversi(){
  if(CONV[cvCat]==="gas")return viewGasConv();
  $("#app").innerHTML=`<div class="chips" id="cvC">${Object.keys(CONV).map(k=>`<button class="${k===cvCat?"on":""}" data-k="${k}">${k}</button>`).join("")}</div>
  <div class="card"><h2>${cvCat}</h2><div class="row"><label>Nilai<input id="cvV" type="number" inputmode="decimal" value="1"></label>
  <label>Dari<select id="cvU">${(CONV[cvCat]?Object.keys(CONV[cvCat]):["°C","°F","K"]).map(u=>`<option>${u}</option>`).join("")}</select></label></div><div class="kv" id="cvR"></div>
  ${cvCat==="Laju alir gas"?'<div class="note">Nm³ @0 °C 1 atm; Sm³ & SCF @15 °C / 60 °F, 1 atm (pendekatan gas ideal).</div>':""}
  ${cvCat==="Tekanan"?'<div class="note">Gauge vs absolute: bara = barg + 1,013.</div>':""}</div>
  <div class="card"><h2>NPS ↔ DN ↔ OD</h2><div class="tw"><table><thead><tr><th>NPS</th><th>DN</th><th>OD in</th><th>OD mm</th></tr></thead><tbody>${PIPES.map(p=>`<tr><td>${p.nps}"</td><td>${p.dn}</td><td>${p.od.toFixed(3)}</td><td>${(p.od*25.4).toFixed(1)}</td></tr>`).join("")}</tbody></table></div></div>`;
  $("#cvC").onclick=e=>{const b=e.target.closest("button");if(!b)return;cvCat=b.dataset.k;ls("cv",cvCat);viewKonversi()};
  const c=()=>{const v=+$("#cvV").value,u=$("#cvU").value;let out;
   if(!CONV[cvCat]){const C=u==="°C"?v:u==="°F"?(v-32)*5/9:v-273.15;out=[["°C",C],["°F",C*9/5+32],["K",C+273.15]]}
   else{const b=v*CONV[cvCat][u];out=Object.entries(CONV[cvCat]).map(([k,f])=>[k,b/f])}
   $("#cvR").innerHTML=out.map(([k,x])=>`<div>${k}</div><div class="${k===u?"hl":""}">${fmtG(x)}</div>`).join("")};
  $("#cvV").oninput=c;$("#cvU").onchange=c;c();
}
function fmtG(x){if(x===0)return"0";const a=Math.abs(x);if(a>=1e7||a<1e-4)return x.toExponential(4);return x.toLocaleString("id-ID",{maximumSignificantDigits:7})}

const VIEWS={gasket:viewGasket,valve:viewValve,pipa:viewPipa,flange:viewFlange,fitting:viewFitting,pe:viewPE,hitung:viewHitung,konversi:viewKonversi};
render();
